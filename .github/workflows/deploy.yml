name: Approved production deployment
on:
  workflow_dispatch:
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run format:check && npm test && npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Validate production bundle without deployment
        run: npx wrangler deploy --env production --dry-run --outdir worker-build
      - name: Reject unconfigured production target
        run: node scripts/check-production.mjs
      - run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}